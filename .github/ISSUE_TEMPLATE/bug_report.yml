name: Bug report
description: A crash, a difference from the original game, or another bug
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting!

        ### First: press **Ctrl+F12** in the game
        It makes a zip with the logs, your settings and your last saved game, and opens its folder: **drag that zip into the last box below**.
        With it we can usually replay exactly what you saw; without it, many reports cannot be acted on.
        (Also on the launcher: "make a problem report"; after a crash the program offers it by itself.)

        Nothing is sent from your computer: the zip is a file you attach here yourself. What it holds: [docs/REPORTING.md](https://github.com/Arkana-Mechanika-Studios/darklands-restoration/blob/master/docs/REPORTING.md).
  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem
      options:
        - Crash
        - Difference from the original game
        - Other bug
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release and commit (filled in by the program's report form; also on the start screen and in report.txt).
      placeholder: "1.0.0-rc4 (commit abc1234)"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Operating system (Windows 11, Linux, Steam Deck ...).
      placeholder: "Windows 11"
    validations:
      required: true
  - type: textarea
    id: what_did
    attributes:
      label: What you did
      description: The exact keys and clicks, from the saved game in the zip if there is one. If you cannot repeat it, say how it started.
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: What you saw, or the error.
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: What the original game does (for a difference)
      description: Which side shows what. Leave empty for a crash or another bug.
  - type: textarea
    id: attachments
    attributes:
      label: Report zip (Ctrl+F12) and screenshots
      description: |
        Drag the report zip (`reports/darklands-report-....zip`, made by Ctrl+F12 and opened for you by the program) into this box.
        For a difference, add a screenshot of each side at the same moment (F12 in this program, DOSBox's capture key in the original).
        GitHub takes attachments only from a signed-in account.
    validations:
      required: true
